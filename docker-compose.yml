services:
  monitor:
    build: .
    image: expense_monitor:latest
    container_name: expense_monitor
    restart: unless-stopped
    # Auth callback now, dashboard in the future: port 7777.
    ports:
      - "7777:7777"
    command: ["serve", "--config", "/config.yaml"]
    volumes:
      - /srv/piggybank/config.yaml:/config.yaml:ro   # configuration
      - /srv/piggybank/keys:/keys:ro                 # private .pem key
      - /srv/piggybank/certs:/certs:ro               # Tailscale certificates
      - /srv/piggybank/data:/data                    # session.json + expense_monitor.db (persistent)

# One-off authorization (writes /data/session.json, then the service uses it):
#   docker compose run --rm --service-ports monitor auth --config /config.yaml

# Configurazione di expense_monitor. Copia in config.yaml e compila i valori.

enablebanking:
  base_url: https://api.enablebanking.com
  application_id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"  # ID applicazione (Control Panel)
  private_key_path: "/keys/app.pem"                        # chiave privata .pem scaricata alla registrazione
  country: IT                                              # ISO 3166 (es. IT)
  aspsp_name: ""                                           # nome esatto della banca (da GET /aspsps)
  psu_type: personal
  consent_days: 90                                         # durata del consenso (max ~90 per conti personali)

auth_server:
  listen_addr: ":7777"
  redirect_url: "https://HOST.TAILNET.ts.net:7777/callback"  # deve essere whitelisted nel Control Panel
  tls_cert_path: "/certs/HOST.TAILNET.ts.net.crt"            # `tailscale cert`
  tls_key_path: "/certs/HOST.TAILNET.ts.net.key"

storage:
  db_path: "/data/expense_monitor.db"
  session_path: "/data/session.json"

sync:
  times_per_day: 2          # numero di sincronizzazioni al giorno (intervallo = 24h / questo valore)
  initial_lookback_days: 90 # quanto indietro scaricare alla prima sync

# PREDISPOSTO per la prossima iterazione (non usato ora).
telegram:
  enabled: false
  bot_token: ""
  chat_id: ""
  rules:
    - name: "spese sopra 100"
      min_amount: 100.0
      credit_debit: DBIT
